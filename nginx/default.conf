server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/pdfjs/headers.conf;

    # These explicit types work across Nginx image MIME table versions.
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json map;
        application/wasm wasm;
        application/pdf pdf;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
        application/octet-stream bcmap;
        text/plain ftl properties;
    }

    location = / {
        return 302 /web/viewer.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /runtime-config.json {
        # Nginx does not inherit parent headers when this location adds headers.
        include /etc/nginx/pdfjs/headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
